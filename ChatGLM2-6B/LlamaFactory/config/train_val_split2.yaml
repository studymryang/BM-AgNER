### model
model_name_or_path: /root/autodl-tmp/glm-4-9b
trust_remote_code: true

### method
stage: sft
do_train: true
do_eval: true
finetuning_type: lora
lora_rank: 16
lora_alpha: 32
lora_target: "query_key_value,dense,dense_h_to_4h,dense_4h_to_h"
lora_dropout: 0.05

### dataset - 训练集和验证集分开配置
dataset: Agricultural_train_dataset
eval_dataset: Agricultural_val_dataset
template: default
cutoff_len: 1024
max_samples: 100000
preprocessing_num_workers: 4
dataloader_num_workers: 4
val_size: 0

### output
output_dir: saves/glm-4-9b/train/2026-10-08-09-12
logging_steps: 5
save_steps: 20
save_total_limit: 3
overwrite_output_dir: true
save_only_model: false
report_to: tensorboard

### eval - 验证配置
eval_strategy: steps
eval_steps: 20
per_device_eval_batch_size: 2
metric_for_best_model: eval_loss
greater_is_better: false
load_best_model_at_end: true


### train
per_device_train_batch_size: 2
gradient_accumulation_steps: 8
learning_rate: 3.0e-5
num_train_epochs: 15.0
lr_scheduler_type: cosine
warmup_ratio: 0.05
warmup_steps: 100
bf16: true
tf32: true
max_grad_norm: 0.5
ddp_timeout: 180000000
resume_from_checkpoint: null
weight_decay: 0.01
gradient_checkpointing: true
seed: 42
optim: adamw_torch
